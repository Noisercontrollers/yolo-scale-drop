# Ultralytics YOLO26n P3-drop variant: P4/16 + P5/32 two-scale detection (no P3/8 small branch)
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 20 # number of classes (VOC)
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
depth_multiple: 0.5 # yolo26n scale
width_multiple: 0.25 # yolo26n scale
max_channels: 1024

# Backbone (identical to yolo26n)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head (P3 branch removed; P4 = top-down C3k2, then P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 16 (P5/32-large)

  - [[13, 16], 1, Detect, [nc]] # Detect(P4, P5)
